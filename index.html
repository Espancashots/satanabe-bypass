<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>3105 Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">3105</div>
        <h1>Painel Admin</h1>
      </div>
      <button id="logoutBtn" class="ghost hidden">Sair</button>
    </header>

    <section id="authView" class="card auth-card">
      <h2>Entrar</h2>
      <p class="muted">Use sua conta administrativa.</p>
      <label>E-mail<input id="email" type="email" autocomplete="email" /></label>
      <label>Senha<input id="password" type="password" autocomplete="current-password" /></label>
      <div class="row">
        <button id="loginBtn">Entrar</button>
        <button id="signupBtn" class="secondary">Criar conta</button>
      </div>
      <p id="authMsg" class="msg"></p>
    </section>

    <section id="bootstrapView" class="card hidden">
      <h2>Ativar administrador</h2>
      <p class="muted">Essa etapa acontece uma única vez.</p>
      <label>Código de bootstrap<input id="bootstrapCode" type="text" autocapitalize="characters" /></label>
      <button id="bootstrapBtn">Ativar este administrador</button>
      <p id="bootstrapMsg" class="msg"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="metrics">
        <article class="metric"><span>Total</span><strong id="mTotal">0</strong></article>
        <article class="metric"><span>Ativas</span><strong id="mActive">0</strong></article>
        <article class="metric"><span>Aparelhos</span><strong id="mDevices">0</strong></article>
        <article class="metric"><span>Validações</span><strong id="mValidations">0</strong></article>
      </div>

      <section class="card">
        <div class="section-head"><div><h2>Acesso do app</h2><p class="muted">Liga ou bloqueia novas validações.</p></div></div>
        <div class="row wrap">
          <label class="switchline"><input id="appEnabled" type="checkbox" /><span>Aplicativo liberado</span></label>
          <input id="appMessage" class="grow" placeholder="Mensagem exibida quando bloqueado" />
          <button id="saveAccessBtn">Salvar</button>
        </div>
        <p id="accessMsg" class="msg"></p>
      </section>

      <section class="card">
        <div class="section-head"><div><h2>Criar keys</h2><p class="muted">Geração e vinculação por aparelho.</p></div></div>
        <div class="grid-form">
          <label>Duração
            <select id="duration">
              <option value="10800">3 horas</option>
              <option value="36000">10 horas</option>
              <option value="86400" selected>1 dia</option>
              <option value="259200">3 dias</option>
              <option value="604800">7 dias</option>
              <option value="2592000">30 dias</option>
              <option value="31536000">1 ano</option>
            </select>
          </label>
          <label>Aparelhos<input id="maxDevices" type="number" min="1" max="20" value="1" /></label>
          <label>Quantidade<input id="quantity" type="number" min="1" max="50" value="1" /></label>
          <label class="wide">Observação<input id="note" type="text" maxlength="500" placeholder="Cliente, pedido, observação..." /></label>
        </div>
        <button id="createBtn">Gerar key(s)</button>
        <textarea id="createdKeys" class="key-output" readonly placeholder="As keys criadas aparecem aqui"></textarea>
        <p id="createMsg" class="msg"></p>
      </section>

      <section class="card">
        <div class="section-head">
          <div><h2>Keys</h2><p class="muted">Gerencie status, validade e aparelhos.</p></div>
          <button id="refreshBtn" class="secondary">Atualizar</button>
        </div>
        <input id="search" type="search" placeholder="Buscar key ou observação" />
        <div id="licenseList" class="license-list"></div>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
